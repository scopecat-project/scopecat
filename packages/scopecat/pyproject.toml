[project]
name = "scopecat"
version = "0.1.0"
description = "Local-first toolkit for durable laboratory experiment workflows."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "httpx2>=2",
  "numpy>=2",
  "packaging>=24",
  "pyarrow>=15",
  "pydantic>=2",
  "xarray>=2024.1",
]

[project.scripts]
scopecat-generate-instrument-clients = "scopecat.sdk.instruments.client_codegen:main"

[project.optional-dependencies]
pandas = [
  "pandas>=2",
]
polars = [
  "polars>=1",
]

[dependency-groups]
test = [
  "hypothesis>=6.155.7",
  "pytest>=9",
  "scopecat-testkit",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.pytest]
addopts = ["--import-mode=importlib"]
minversion = "9.0"
strict_config = true
strict_markers = true
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.uv.sources]
scopecat-testkit = { workspace = true }
