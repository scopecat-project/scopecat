[project]
name = "scopecat-server"
version = "0.1.0"
description = "Local HTTP and SSE transport for a Scopecat project daemon."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.116",
  "filelock>=4.2",
  "httpx2>=2",
  "jsonschema>=4.26",
  "psutil>=7",
  "rich>=15",
  "scopecat==0.1.0",
  "typer>=0.20",
  "uvicorn>=0.35",
]

[dependency-groups]
test = [
  "pytest>=9",
  "scopecat-quantum==0.1.0",
  "scopecat-testkit[server]==0.1.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest]
addopts = ["--import-mode=importlib"]
minversion = "9.0"
strict_config = true
strict_markers = true
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.uv.sources]
scopecat = { workspace = true }
scopecat-quantum = { workspace = true }
scopecat-testkit = { workspace = true }
