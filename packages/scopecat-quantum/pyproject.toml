[project]
name = "scopecat-quantum"
version = "0.1.0"
description = "Hardware-independent quantum domain building blocks for Scopecat."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "numpy>=2",
  "scipy>=1.16",
  "scopecat",
]

[dependency-groups]
test = [
  "hypothesis>=6.155.7",
  "pytest>=9",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest]
addopts = ["--import-mode=importlib"]
minversion = "9.0"
strict_config = true
strict_markers = true
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.uv.sources]
scopecat = { workspace = true }
