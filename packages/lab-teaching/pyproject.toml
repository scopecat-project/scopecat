[project]
name = "scopecat-lab-teaching"
version = "0.2.0"
description = "Isolated synthetic lab teaching support and project resources."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["matplotlib>=3.10", "numpy>=2", "scopecat"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
# Chinese course resources are shipped alongside the English entry guide.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/*.ipynb" = ["E402"]  # Refresh must precede author imports.

[tool.uv.build-backend]
module-name = "lab_teaching"

[tool.uv.sources]
scopecat = { workspace = true }
