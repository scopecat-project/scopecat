[project]
name = "scopecat-instruments"
version = "0.1.0"
description = "Real and virtual laboratory instrument drivers for Scopecat."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "numpy>=2",
  "psutil>=7.2",
  "pydantic>=2",
  "pyserial>=3.5",
  "scopecat",
]

[dependency-groups]
test = [
  "pytest>=9",
  "scopecat-testkit",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.pytest]
addopts = ["--import-mode=importlib"]
minversion = "9.0"
strict_config = true
strict_markers = true
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.uv.sources]
scopecat = { workspace = true }
scopecat-testkit = { workspace = true }
