[project]
name = "scopecat-testkit"
version = "0.1.0"
description = "Shared test support and adapter qualification fixtures for Scopecat."
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2",
  "scopecat==0.1.0",
]

[project.optional-dependencies]
server = [
  "scopecat-server==0.1.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src"]

[tool.uv.sources]
scopecat = { workspace = true }
scopecat-server = { workspace = true }
