name: Native smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/native-smoke.yml
      - .python-version
      - pyproject.toml
      - uv.lock
      - scripts/app_build/delivery.py
      - scripts/verify_native_windows.py
      - scripts/app_build/native_launcher.*
      - scripts/app_build/native_package.py
      - packages/scopecat-app/src/scopecat_app/native_bootstrap.py
      - packages/scopecat-app/src/scopecat_app/desktop*.py
      - packages/scopecat-app/src/scopecat_app/application_runtime.py
      - apps/scopecat-ui/src/App.tsx
      - apps/scopecat-ui/src/features/application/DesktopSession.tsx
      - apps/scopecat-ui/src/features/application/WorkspaceNavigation.tsx
      - apps/scopecat-ui/src/features/launch/launch-close-barrier.ts

concurrency:
  group: native-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-smoke:
    name: Native smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version-file: uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/scopecat-ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
      - name: Prepare smoke dependencies
        run: uv sync --locked --group delivery
      - name: Build platform delivery
        run: uv run --locked python -m scripts.app_build.delivery "${{ runner.temp }}/delivery"
      - name: Build native host without installer
        shell: bash
        run: |
          native_app="$RUNNER_TEMP/Scopecat"
          if [ "$RUNNER_OS" = "macOS" ]; then native_app="$native_app.app"; fi
          uv run --locked python -m scripts.app_build.native_package "$RUNNER_TEMP/delivery" "$native_app"
      - name: Prepare isolated native application
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-acceptance"
          executable="$RUNNER_TEMP/Scopecat/Scopecat.exe"
          if [ "$RUNNER_OS" = "macOS" ]; then executable="$RUNNER_TEMP/Scopecat.app/Contents/MacOS/Scopecat"; fi
          "$executable" --home "$RUNNER_TEMP/native-acceptance" --check-result "$RUNNER_TEMP/native-acceptance/prepare.json"
      - name: Run independent short native smoke
        shell: bash
        run: |
          native_app="$RUNNER_TEMP/Scopecat"
          if [ "$RUNNER_OS" = "macOS" ]; then native_app="$native_app.app"; fi
          uv run --locked python scripts/verify_native_windows.py "$native_app" "$RUNNER_TEMP/native-acceptance" --short
      - name: Retain native acceptance logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/native-acceptance/prepare.json
            ${{ runner.temp }}/native-acceptance/native-windows/
            ${{ runner.temp }}/native-acceptance/data/native-start.log
            ${{ runner.temp }}/native-acceptance/data/desktop/desktop.log
