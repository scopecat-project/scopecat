name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Explicit SemVer release version (for example 0.3.0-rc.1)
        required: true
        type: string
      build_number:
        description: Increasing native build number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.prepare.outputs.commit }}
      branch: ${{ steps.prepare.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install pinned Knope
        run: |
          curl --fail --location --output "$RUNNER_TEMP/knope.tgz" https://github.com/knope-dev/knope/releases/download/knope/v0.23.0/knope-x86_64-unknown-linux-musl.tgz
          echo "76a970a5e237344abc14be3de37ed50c021b659a9b66b3f54afc77e6d48ac501  $RUNNER_TEMP/knope.tgz" | sha256sum --check
          mkdir "$RUNNER_TEMP/knope-bin"
          tar -xzf "$RUNNER_TEMP/knope.tgz" --strip-components=1 -C "$RUNNER_TEMP/knope-bin"
          echo "$RUNNER_TEMP/knope-bin" >> "$GITHUB_PATH"
      - name: Prepare and push review branch
        id: prepare
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked python scripts/release.py prepare "$VERSION" --build-number "$BUILD_NUMBER"
          branch="release/$VERSION"
          for endpoint in "git/ref/heads/$branch" "git/ref/tags/v$VERSION" "releases/tags/v$VERSION"; do
            if gh api "repos/$GITHUB_REPOSITORY/$endpoint" > "$RUNNER_TEMP/existing.json" 2> "$RUNNER_TEMP/api-error"; then
              echo "Refusing existing branch, tag or release: $endpoint" >&2
              exit 1
            else
              grep -q 'HTTP 404' "$RUNNER_TEMP/api-error"
            fi
          done
          # The release-by-tag endpoint can omit drafts; enumerate authenticated releases too.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fx -- "v$VERSION" "$RUNNER_TEMP/release-tags"; then
            echo "Refusing existing published or draft release: v$VERSION" >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "Prepare release $VERSION"
          git push origin "HEAD:refs/heads/$branch"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}

  review:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Open draft release PR after CI and docs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.branch }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          Prepare the explicitly selected release version $VERSION from changefiles.

          CI and documentation were checked on commit $RELEASE_COMMIT in this workflow:
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Review and merge this PR, then manually run Full acceptance with profile full on that merged commit. After CI, documentation deployment and full acceptance succeed for that exact commit, manually run Publish release with its full SHA. This PR does not publish a tag or release. Default-token pushes do not trigger another workflow; validation above is an explicit dependency. If branch protection requires a standalone CI run, dispatch CI on this branch before merging.
          EOF
          gh pr create --draft --base main --head "$RELEASE_BRANCH" --title "Release $VERSION" --body-file "$RUNNER_TEMP/release-pr.md"
