name: Release failure targeted diagnostics
on:
  push:
    branches: [qualify/68980-release-failures]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version-file: uv.lock
      - name: Diagnose original journey-2 scheduling and load
        env:
          SCOPECAT_TEST_DIAGNOSTICS: test-diagnostics
        run: >-
          uv run --locked python -m scopecat_testkit.check journey --shard 2/2 --
          --maxprocesses=2 -p scripts.pytest_diagnostics -p scripts.release_failure_diagnostics
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: targeted-python-${{ runner.os }}
          path: test-diagnostics
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version-file: uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: apps/scopecat-ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
        working-directory: apps/scopecat-ui
      - run: pnpm exec vite build
        working-directory: apps/scopecat-ui
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/scopecat-ui
      - name: Diagnose original browser-2 worker lifetime and load
        run: pnpm exec playwright test --project=journey-2 --reporter=line,json
        working-directory: apps/scopecat-ui
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/timings.json
      - name: Print bounded browser failure context
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('apps/scopecat-ui/test-results').rglob('error-context.md'):
              print('DIAG', p, p.read_text()[:20000], flush=True)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: targeted-browser
          path: apps/scopecat-ui/test-results
