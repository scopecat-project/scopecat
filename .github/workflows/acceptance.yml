name: Full acceptance

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Qualification scope (ordinary PR CI is unchanged)
        type: choice
        default: full
        options:
          - full
          - local-application
          - service-lifecycle
          - native-distribution
          - public-preview

run-name: Acceptance (${{ inputs.profile }}) @ ${{ github.ref_name }}

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.profile }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  public-preview:
    if: inputs.profile == 'public-preview'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion \
            --jq 'any(.[]; .conclusion == "success")' | grep -qx true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: apps/scopecat-ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Build public artifacts
        run: uv run --locked python scripts/build_preview.py preview
      - name: Publish immutable preview assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "preview-$GITHUB_SHA" preview/* --target "$GITHUB_SHA" \
            --draft --prerelease --title "Preview $GITHUB_SHA" \
            --notes "Public Python wheels and workbench assets from this exact commit. Dependencies remain consumer-locked; this is not a native application installer."
          gh release edit "preview-$GITHUB_SHA" --draft=false

  native-distribution:
    if: inputs.profile == 'native-distribution'
    name: Native distribution (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/scopecat-ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
      - name: Build native application and installer
        shell: bash
        run: |
          uv run --locked --group delivery pytest -v -n 0 \
            packages/lab-tools/tests/test_acceptance_workspaces.py \
            packages/lab-tools/tests/test_desktop_platform.py \
            packages/lab-tools/tests/test_desktop_session.py \
            packages/lab-tools/tests/test_desktop_files.py \
            packages/lab-tools/tests/test_installed_adapter_journey.py \
            packages/scopecat-instruments/tests/test_sdk_process.py \
            packages/scopecat-server/tests/test_instrument_worker.py \
            packages/scopecat-server/tests/storage/sqlite/test_run_repository.py::test_capture_import_is_idempotent_and_keeps_execution_tables_empty
          uv run --locked python -m lab_tools.delivery "$RUNNER_TEMP/delivery"
          if [ "$RUNNER_OS" = "Windows" ]; then
            native_app="$RUNNER_TEMP/Scopecat"
            installer="$RUNNER_TEMP/Scopecat-Setup.exe"
          else
            native_app="$RUNNER_TEMP/Scopecat.app"
            installer="$RUNNER_TEMP/Scopecat.dmg"
          fi
          uv run --locked python -m lab_tools.native_package "$RUNNER_TEMP/delivery" "$native_app" --installer "$installer"
          if [ "$RUNNER_OS" = "macOS" ]; then
            uv run --locked python scripts/verify_macos_desktop_exit.py "$native_app"
          fi
          uv run --locked python scripts/measure_packaged_runtime.py --app "$native_app" --output "$RUNNER_TEMP/direct-runtime"
          uv run --locked python scripts/verify_native_application.py "$native_app" "$RUNNER_TEMP/native-acceptance" "$installer"
          if [ "$RUNNER_OS" = "macOS" ]; then
            uv run --locked python scripts/verify_macos_download.py "$installer" "$RUNNER_TEMP/macos-download"
          fi
      - name: Retain qualified preview installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scopecat-preview-${{ runner.os }}-${{ github.sha }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: |
            ${{ runner.temp }}/Scopecat.dmg
            ${{ runner.temp }}/Scopecat-Setup.exe
            ${{ runner.temp }}/native-acceptance/native-release.json
            ${{ runner.temp }}/native-acceptance/bundle.json
      - name: Retain native acceptance logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/native-acceptance/result.json
            ${{ runner.temp }}/native-acceptance/data-journey.json
            ${{ runner.temp }}/native-acceptance/data/native-start.log
            ${{ runner.temp }}/direct-runtime/report.json
            ${{ runner.temp }}/macos-download/report.json

  service-lifecycle:
    if: inputs.profile == 'service-lifecycle'
    name: Service lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Verify service recovery and process ownership
        run: >-
          uv run --locked pytest -q -n 0
          packages/lab-tools/tests/test_application_runtime.py
          packages/lab-tools/tests/test_desktop_session.py
          packages/lab-tools/tests/test_desktop_install.py
          packages/lab-tools/tests/test_teaching_delivery.py
          packages/scopecat-server/tests/test_practice_workers.py
          packages/scopecat-server/tests/test_practice_lifecycle.py

  python-tests:
    if: inputs.profile == 'full'
    name: Python ${{ matrix.group.label }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        group:
          - { label: core, suite: core, shard: 1/1 }
          - { label: journey-1, suite: journey, shard: 1/2 }
          - { label: journey-2, suite: journey, shard: 2/2 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Run selected tests
        env:
          SCOPECAT_TEST_DIAGNOSTICS: test-diagnostics
        shell: bash
        run: |
          uv run --locked python -m scopecat_testkit.check "${{ matrix.group.suite }}" \
            --shard "${{ matrix.group.shard }}" -- --maxprocesses=2 -p scripts.pytest_diagnostics

      - name: Retain test timings and startup diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.os }}-${{ matrix.group.label }}
          path: |
            .test-results/
            test-diagnostics/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Test data ecosystem adapters
        if: matrix.group.label == 'core'
        run: >-
          uv run --locked --package scopecat --extra pandas pytest -q
          packages/scopecat/tests/measurements/test_dataset.py

  benchmark-smoke:
    if: inputs.profile == 'full'
    name: Benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Run benchmark smoke tests
        run: uv run --locked pytest -q -n 0 benchmarks/smoke

  python-quality:
    if: inputs.profile == 'full'
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Check generated instrument clients
        run: uv run --locked python scripts/generate_instrument_clients.py --check

      - name: Build and import isolated package wheels
        run: |
          wheel_dir="${RUNNER_TEMP}/scopecat-wheels"
          uv build --package scopecat --no-sources --out-dir "${wheel_dir}"
          uv build --package scopecat-server --no-sources --out-dir "${wheel_dir}"
          uv build --package scopecat-instruments --no-sources --out-dir "${wheel_dir}"
          uv build --package scopecat-quantum --no-sources --out-dir "${wheel_dir}"
          uv run --isolated --no-project \
            --with "${wheel_dir}"/scopecat-*.whl \
            -- python -c "import scopecat"
          uv run --isolated --no-project \
            --with "${wheel_dir}"/scopecat-*.whl \
            --with "${wheel_dir}"/scopecat_server-*.whl \
            -- python -c "import scopecat_server"
          uv run --isolated --no-project \
            --with "${wheel_dir}"/scopecat-*.whl \
            --with "${wheel_dir}"/scopecat_instruments-*.whl \
            -- python -c "import scopecat_instruments"
          uv run --isolated --no-project \
            --with "${wheel_dir}"/scopecat-*.whl \
            --with "${wheel_dir}"/scopecat_quantum-*.whl \
            -- python -c "import scopecat_quantum"

      - name: Run type check
        run: uv run --locked basedpyright

      - name: Check architecture
        run: uv run --locked lint-imports

      - name: Run lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

  ui:
    if: inputs.profile == 'full' || inputs.profile == 'local-application'
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/scopecat-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --project ../..

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/scopecat-ui/package.json
          cache: true
          cache_dependency_path: apps/scopecat-ui/pnpm-lock.yaml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated daemon API types
        if: inputs.profile == 'full'
        run: pnpm run check:api

      - name: Check UI formatting
        if: inputs.profile == 'full'
        run: pnpm run format:check

      - name: Run UI lint
        if: inputs.profile == 'full'
        run: pnpm run lint

      - name: Run UI tests
        if: inputs.profile == 'full'
        run: pnpm run test

      - name: Run UI type check
        if: inputs.profile == 'full'
        run: pnpm run typecheck

      - name: Build standard framework artifacts and matching GUI
        run: uv run --locked --project ../.. python ../../scripts/build_preview.py ../../dist/framework

      - name: Upload shared framework artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scopecat-framework
          path: dist/framework
          if-no-files-found: error
          retention-days: 7

  browser-tests:
    name: Browser journey ${{ matrix.shard }}/2
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/scopecat-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/scopecat-ui/package.json
          cache: true
          cache_dependency_path: apps/scopecat-ui/pnpm-lock.yaml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --project ../..
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scopecat-framework
          path: dist/framework
      - name: Extract the shared browser GUI
        run: python -m zipfile -e ../../dist/framework/scopecat-ui.zip dist
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run browser end-to-end shard
        run: pnpm exec playwright test --project=journey-${{ matrix.shard }} --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/timings.json
      - name: Retain browser timings and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            apps/scopecat-ui/playwright-report
            apps/scopecat-ui/test-results
          if-no-files-found: warn
          retention-days: 7

  installed-artifacts:
    name: Installed artifacts (${{ matrix.os }})
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Download standard framework artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scopecat-framework
          path: dist/framework

      - name: Install and verify virtual measurement and restart
        run: uv run --locked python scripts/verify_installed_framework.py dist/framework

      - name: Build target-platform offline tutorial delivery
        run: >-
          uv run --locked --group delivery python -m lab_tools.delivery
          dist/tutorial --public-artifacts dist/framework

      - name: Archive the complete offline delivery
        run: python -m zipfile -c dist/tutorial.zip dist/tutorial

      - name: Verify the archived delivery, notebooks and installed application
        run: |
          python -m zipfile -e dist/tutorial.zip dist/delivery-check
          uv run --locked --group delivery python scripts/verify_teaching_delivery.py dist/delivery-check/tutorial dist/tutorial-evidence

      - name: Retain tutorial delivery and executed notebooks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scopecat-tutorial-${{ matrix.os }}
          path: |
            dist/tutorial.zip
            dist/tutorial-evidence/**/verified-*.ipynb
            dist/tutorial-evidence/**/acceptance.json
            dist/tutorial-evidence/**/*.log
          retention-days: 7
          if-no-files-found: warn

  docs:
    if: inputs.profile == 'full'
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Build documentation
        run: |
          uv run --locked python scripts/check_document_links.py
          uv run --locked --group docs zensical build --strict

  gate:
    name: Acceptance gate (${{ inputs.profile }})
    if: ${{ always() }}
    needs:
      - public-preview
      - native-distribution
      - service-lifecycle
      - python-tests
      - browser-tests
      - benchmark-smoke
      - installed-artifacts
      - python-quality
      - ui
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful jobs
        env:
          PROFILE: ${{ inputs.profile }}
          PUBLIC_PREVIEW_RESULT: ${{ needs['public-preview'].result }}
          NATIVE_DISTRIBUTION_RESULT: ${{ needs['native-distribution'].result }}
          SERVICE_LIFECYCLE_RESULT: ${{ needs['service-lifecycle'].result }}
          INSTALLED_ARTIFACTS_RESULT: ${{ needs['installed-artifacts'].result }}
          BROWSER_TESTS_RESULT: ${{ needs['browser-tests'].result }}
          PYTHON_TESTS_RESULT: ${{ needs['python-tests'].result }}
          BENCHMARK_SMOKE_RESULT: ${{ needs['benchmark-smoke'].result }}
          PYTHON_QUALITY_RESULT: ${{ needs['python-quality'].result }}
          UI_RESULT: ${{ needs.ui.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          if [ "$PROFILE" = public-preview ]; then
            test "$PUBLIC_PREVIEW_RESULT" = success
            for result in "$NATIVE_DISTRIBUTION_RESULT" "$SERVICE_LIFECYCLE_RESULT" \
              "$INSTALLED_ARTIFACTS_RESULT" "$BROWSER_TESTS_RESULT" "$UI_RESULT" \
              "$PYTHON_TESTS_RESULT" "$BENCHMARK_SMOKE_RESULT" \
              "$PYTHON_QUALITY_RESULT" "$DOCS_RESULT"; do
              test "$result" = skipped
            done
            exit 0
          fi
          test "$PUBLIC_PREVIEW_RESULT" = skipped
          if [ "$PROFILE" = native-distribution ]; then
            test "$NATIVE_DISTRIBUTION_RESULT" = success
            for result in "$SERVICE_LIFECYCLE_RESULT" "$INSTALLED_ARTIFACTS_RESULT" \
              "$BROWSER_TESTS_RESULT" "$UI_RESULT" "$PYTHON_TESTS_RESULT" \
              "$BENCHMARK_SMOKE_RESULT" "$PYTHON_QUALITY_RESULT" "$DOCS_RESULT"; do
              test "$result" = skipped
            done
            exit 0
          fi
          test "$NATIVE_DISTRIBUTION_RESULT" = skipped
          if [ "$PROFILE" = service-lifecycle ]; then
            test "$SERVICE_LIFECYCLE_RESULT" = success
            for result in "$INSTALLED_ARTIFACTS_RESULT" "$BROWSER_TESTS_RESULT" "$UI_RESULT" \
              "$PYTHON_TESTS_RESULT" "$BENCHMARK_SMOKE_RESULT" "$PYTHON_QUALITY_RESULT" "$DOCS_RESULT"; do
              test "$result" = skipped
            done
            exit 0
          fi
          test "$SERVICE_LIFECYCLE_RESULT" = skipped
          test "$INSTALLED_ARTIFACTS_RESULT" = success
          test "$BROWSER_TESTS_RESULT" = success
          test "$UI_RESULT" = success
          case "$PROFILE" in
            full) expected=success ;;
            local-application) expected=skipped ;;
            *) exit 1 ;;
          esac
          test "$PYTHON_TESTS_RESULT" = "$expected"
          test "$BENCHMARK_SMOKE_RESULT" = "$expected"
          test "$PYTHON_QUALITY_RESULT" = "$expected"
          test "$DOCS_RESULT" = "$expected"
