name: Full acceptance
on:
  workflow_dispatch:
run-name: Temporary Windows SQLite diagnostic @ ${{ github.ref_name }}
jobs:
  diagnostic:
    name: SQLite diagnostic (${{ matrix.scenario }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [writer, close]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version-file: uv.lock
      - name: Run original representatives once
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
          SCOPECAT_TEST_DIAGNOSTICS: test-diagnostics
          SCOPECAT_SQLITE_PROBE: test-diagnostics
          PYTHONFAULTHANDLER: "1"
        run: |
          export SCOPECAT_SQLITE_PROBE="$PWD/test-diagnostics"
          if [ "$SCENARIO" = writer ]; then
            tests=(
              'testing/reference_lab/tests/test_typed_candidates.py::test_branch_procedure_rejection_and_stale_destination_do_not_publish[parallel-False]'
              'testing/reference_lab/tests/test_typed_candidates.py::test_branch_procedure_rejection_and_stale_destination_do_not_publish[sequential-False]'
              'packages/scopecat-app/tests/test_calibration_teaching_journey.py::test_calibration_history_policy_regressions'
            )
          else
            tests=(
              'packages/scopecat-app/tests/test_teaching_mean_iq_journey.py::test_shipped_editing_lessons[None]'
              'packages/scopecat-server/tests/author_journeys/test_author_refresh.py::test_refresh_freezes_admission_and_analysis_across_restore'
            )
          fi
          uv run --locked pytest -v -n 2 -p scripts.pytest_diagnostics --junitxml=test-diagnostics/result.xml "${tests[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sqlite-diagnostic-${{ matrix.scenario }}
          path: test-diagnostics/
