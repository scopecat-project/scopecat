name: Full acceptance
on:
  workflow_dispatch:
run-name: Temporary Windows original journey context diagnostic @ ${{ github.ref_name }}
jobs:
  diagnostic:
    name: Original journey context (${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version-file: uv.lock
      - name: Run original representatives once
        shell: bash
        env:
          SCOPECAT_TEST_DIAGNOSTICS: test-diagnostics
          SCOPECAT_SQLITE_PROBE: test-diagnostics
          PYTHONFAULTHANDLER: "1"
        run: |
          export SCOPECAT_SQLITE_PROBE="$PWD/test-diagnostics"
          uv run --locked python -m scopecat_testkit.check journey --shard "${{ matrix.shard }}" -- --maxprocesses=2 -p scripts.pytest_diagnostics
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sqlite-context-${{ strategy.job-index }}
          path: |
            test-diagnostics/
            .test-results/
          include-hidden-files: true
