name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  python-tests:
    name: Python ${{ matrix.group.label }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        group:
          - { label: core-1, suite: core, shard: 1/2 }
          - { label: core-2, suite: core, shard: 2/2 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
          enable-cache: true

      - name: Run selected tests
        id: selected-tests
        env:
          SCOPECAT_TEST_DIAGNOSTICS: test-diagnostics
          PYTHONFAULTHANDLER: "1"
        shell: bash
        run: |
          uv run --locked python -m scopecat_testkit.check "${{ matrix.group.suite }}" \
            --shard "${{ matrix.group.shard }}" -- --maxprocesses=2 -p scripts.pytest_diagnostics

      - name: Summarize failed test diagnostics
        if: ${{ failure() && steps.selected-tests.outcome == 'failure' }}
        continue-on-error: true
        run: python scripts/summarize_test_diagnostics.py test-diagnostics

      - name: Retain test timings and startup diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}-${{ matrix.group.label }}
          path: |
            .test-results/
            test-diagnostics/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Test data ecosystem adapters
        if: matrix.group.label == 'core-1'
        run: >-
          uv run --locked --package scopecat --extra pandas --extra polars pytest -q
          packages/scopecat/tests/measurements/test_dataset.py
          packages/scopecat/tests/analysis/test_datasets.py

  # Six explicit cases per OS; measured cold/warm in docs/development/platform-smoke.md.
  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
          enable-cache: true
          cache-suffix: platform-smoke-v1
      - name: Install smoke dependencies
        run: uv sync --locked --no-default-groups --group platform-smoke
      - name: Check pinned portable Python supply
        run: uv run --locked --no-default-groups --group platform-smoke python -m scripts.check_python_supply
      - name: Check relocated Mac console
        if: runner.os == 'macOS'
        run: >-
          uv run --locked --no-default-groups --group platform-smoke pytest -q -n 0
          packages/scopecat-app/tests/test_native_console.py
          packages/scopecat-app/tests/test_dev_host.py::test_compiled_mac_host_loads_relocated_entries
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
      - name: Check Windows native host
        if: runner.os == 'Windows'
        run: >-
          uv run --locked --no-default-groups --group platform-smoke pytest -q -n 0
          packages/scopecat-app/tests/test_windows_native_host.py
      - name: Check Windows author application discovery
        if: runner.os == 'Windows'
        run: >-
          uv run --locked --no-default-groups --group platform-smoke pytest
          -c pyproject.toml -q -n 0
          packages/scopecat-server/tests/test_application_locator.py
      - name: Verify release projection and target names
        run: >-
          uv run --locked --no-default-groups --group platform-smoke pytest -q -n 0
          packages/scopecat-app/tests/test_release_assets.py
          packages/scopecat-app/tests/test_release_identity.py
      - name: Run exact platform selection (no skips)
        env:
          SMOKE_EXPECTED_SHA: ${{ inputs.ref || github.sha }}
        run: uv run --locked --no-default-groups --group platform-smoke python scripts/platform_smoke.py
      - name: Retain platform evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-smoke-${{ matrix.os }}
          path: .test-results/platform-smoke/
          include-hidden-files: true
          if-no-files-found: warn

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
          enable-cache: true

      - name: Check pinned portable Python supply
        run: uv run --locked python -m scripts.check_python_supply

      - name: Check generated instrument clients
        run: uv run --locked python scripts/generate_instrument_clients.py --check

      - name: Run type check
        run: uv run --locked basedpyright

      - name: Check architecture
        run: uv run --locked lint-imports

      - name: Run lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/scopecat-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --project ../..

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/scopecat-ui/package.json
          cache: true
          cache_dependency_path: apps/scopecat-ui/pnpm-lock.yaml

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated daemon API types
        run: pnpm run check:api

      - name: Check UI formatting
        run: pnpm run format:check

      - name: Run UI lint
        run: pnpm run lint

      - name: Run UI tests
        run: pnpm run test

      - name: Run UI type check
        run: pnpm run typecheck

      - name: Build UI
        run: pnpm exec vite build

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
          enable-cache: true

      - name: Build documentation
        run: |
          uv run --locked python scripts/check_document_links.py
          uv run --locked --group docs zensical build --strict

  gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - python-tests
      - python-quality
      - platform-smoke
      - ui
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful jobs
        env:
          PYTHON_TESTS_RESULT: ${{ needs['python-tests'].result }}
          PYTHON_QUALITY_RESULT: ${{ needs['python-quality'].result }}
          PLATFORM_SMOKE_RESULT: ${{ needs['platform-smoke'].result }}
          UI_RESULT: ${{ needs.ui.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          test "$PYTHON_TESTS_RESULT" = success
          test "$PYTHON_QUALITY_RESULT" = success
          test "$PLATFORM_SMOKE_RESULT" = success
          test "$UI_RESULT" = success
          test "$DOCS_RESULT" = success
