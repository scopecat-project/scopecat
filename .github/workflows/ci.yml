name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  python-tests:
    name: Python tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Run tests
        if: runner.os != 'Windows'
        run: uv run --locked pytest

      - name: Run tests with Windows hang diagnostics
        if: runner.os == 'Windows'
        timeout-minutes: 15
        env:
          SCOPECAT_TEST_DIAGNOSTICS: test-diagnostics
        run: uv run --locked python -m pytest -p scripts.pytest_windows_diagnostics

      - name: Retain Windows test diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-diagnostics
          path: test-diagnostics/
          if-no-files-found: warn

      - name: Test data ecosystem adapters
        run: >-
          uv run --locked --package scopecat --extra pandas pytest -q
          packages/scopecat/tests/measurements/test_dataset.py

  benchmark-smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Run benchmark smoke tests
        run: uv run --locked pytest -q -n 0 benchmarks/smoke

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Check generated instrument clients
        run: uv run --locked python scripts/generate_instrument_clients.py --check

      - name: Build and import isolated package wheels
        run: |
          wheel_dir="${RUNNER_TEMP}/scopecat-wheels"
          uv build --package scopecat --no-sources --out-dir "${wheel_dir}"
          uv build --package scopecat-server --no-sources --out-dir "${wheel_dir}"
          uv build --package scopecat-instruments --no-sources --out-dir "${wheel_dir}"
          uv build --package scopecat-quantum --no-sources --out-dir "${wheel_dir}"
          uv run --isolated --no-project \
            --with "${wheel_dir}"/scopecat-*.whl \
            -- python -c "import scopecat"
          uv run --isolated --no-project \
            --with "${wheel_dir}"/scopecat-*.whl \
            --with "${wheel_dir}"/scopecat_server-*.whl \
            -- python -c "import scopecat_server"
          uv run --isolated --no-project \
            --with "${wheel_dir}"/scopecat-*.whl \
            --with "${wheel_dir}"/scopecat_instruments-*.whl \
            -- python -c "import scopecat_instruments"
          uv run --isolated --no-project \
            --with "${wheel_dir}"/scopecat-*.whl \
            --with "${wheel_dir}"/scopecat_quantum-*.whl \
            -- python -c "import scopecat_quantum"

      - name: Run type check
        run: uv run --locked basedpyright

      - name: Check architecture
        run: uv run --locked lint-imports

      - name: Run lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/scopecat-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --project ../..

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/scopecat-ui/package.json
          cache: true
          cache_dependency_path: apps/scopecat-ui/pnpm-lock.yaml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated daemon API types
        run: pnpm run check:api

      - name: Check UI formatting
        run: pnpm run format:check

      - name: Run UI lint
        run: pnpm run lint

      - name: Run UI tests
        run: pnpm run test

      - name: Run UI type check
        run: pnpm run typecheck

      - name: Build UI
        run: pnpm exec vite build

      - name: Build pinned GUI pilot bundle
        run: uv run --project ../.. python ../../scripts/build_server_distribution.py

      - name: Upload pilot bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scopecat-pilot-bundle
          path: dist/scopecat-server
          if-no-files-found: error
          retention-days: 7

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser end-to-end test
        run: pnpm exec playwright test

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            apps/scopecat-ui/playwright-report
            apps/scopecat-ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  installed-pilot:
    name: Installed pilot (${{ matrix.os }})
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Download pilot bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scopecat-pilot-bundle
          path: dist/scopecat-server

      - name: Install and verify virtual measurement and restart
        run: python scripts/verify_pilot_bundle.py dist/scopecat-server

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Build documentation
        run: |
          uv run --locked python scripts/check_document_links.py
          uv run --locked --group docs zensical build --strict

  gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - python-tests
      - benchmark-smoke
      - installed-pilot
      - python-quality
      - ui
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful jobs
        env:
          INSTALLED_PILOT_RESULT: ${{ needs['installed-pilot'].result }}
          PYTHON_TESTS_RESULT: ${{ needs['python-tests'].result }}
          BENCHMARK_SMOKE_RESULT: ${{ needs['benchmark-smoke'].result }}
          PYTHON_QUALITY_RESULT: ${{ needs['python-quality'].result }}
          UI_RESULT: ${{ needs.ui.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          test "$INSTALLED_PILOT_RESULT" = success
          test "$PYTHON_TESTS_RESULT" = success
          test "$BENCHMARK_SMOKE_RESULT" = success
          test "$PYTHON_QUALITY_RESULT" = success
          test "$UI_RESULT" = success
          test "$DOCS_RESULT" = success
