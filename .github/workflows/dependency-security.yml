name: Dependency security

on:
  pull_request:
    branches: [main]
    paths:
      - uv.lock
      - apps/scopecat-ui/pnpm-lock.yaml
      - renovate.json
      - .github/workflows/dependency-security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-audit:
    name: New dependency findings
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read # Read scan artifacts in the reusable workflow.
      security-events: write # Upload SARIF when upload-sarif is enabled.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --no-resolve
        --all-packages
        --lockfile=uv.lock
        --lockfile=apps/scopecat-ui/pnpm-lock.yaml
      fail-on-vuln: false
      # Fork/Dependabot tokens can be read-only. Keep their scan artifacts without
      # requesting elevated execution via pull_request_target or extra secrets.
      upload-sarif: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}

  baseline:
    name: Full dependency baseline
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read # Read scan artifacts in the reusable workflow.
      security-events: write # Upload SARIF when upload-sarif is enabled.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      ref: ${{ github.sha }}
      scan-args: |-
        --no-resolve
        --all-packages
        --lockfile=uv.lock
        --lockfile=apps/scopecat-ui/pnpm-lock.yaml
      fail-on-vuln: false
      upload-sarif: true
