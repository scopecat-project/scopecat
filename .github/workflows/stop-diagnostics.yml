name: Windows daemon stop diagnostics
on:
  push:
    branches: [qualify/windows-stop-diagnostics]
permissions:
  contents: read
jobs:
  repair:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version-file: uv.lock
      - name: Install locked test environment
        run: uv sync --locked
      - name: Reproduce repair shutdown with observations
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$pwd;$pwd/scripts/stop_probe"
          $env:SCOPECAT_STOP_PROBE = "$pwd/stop-diagnostics"
          $env:SCOPECAT_TEST_DIAGNOSTICS = "$pwd/test-diagnostics"
          uv run --locked python -m pytest -v -n 2 -p scripts.pytest_diagnostics --basetemp=stop-test-data "packages/lab-tools/tests/test_array_maintenance.py::test_array_maintenance[repair]" "packages/lab-tools/tests/test_array_maintenance.py::test_array_maintenance[repair-conflict]"
      - name: Print synthetic process observations and daemon logs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem stop-diagnostics -Filter *.jsonl -ErrorAction SilentlyContinue | ForEach-Object { Write-Output $_.Name; Get-Content $_.FullName -Tail 150 }
          Get-ChildItem stop-test-data -Recurse -Filter daemon.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Output $_.FullName; Get-Content $_.FullName -Tail 150 }
          Get-ChildItem stop-diagnostics -Filter stacks-*.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Output $_.Name; Get-Content $_.FullName -Tail 100 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: stop-diagnostics-${{ matrix.attempt }}
          path: |
            stop-diagnostics/
            test-diagnostics/
