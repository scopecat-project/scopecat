name: Windows journey-2 shutdown diagnostics
on:
  push:
    branches: [qualify/windows-stop-diagnostics]
permissions:
  contents: read
jobs:
  journey:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version-file: uv.lock
          enable-cache: true
      - name: Run original Windows journey-2 selection and load
        env:
          SCOPECAT_TEST_DIAGNOSTICS: test-diagnostics
        shell: bash
        run: |
          uv run --locked python -m scopecat_testkit.check "journey" \
            --shard "2/2" -- --maxprocesses=2 -p scripts.pytest_diagnostics
      - name: Print bounded repair shutdown evidence
        if: always()
        shell: bash
        run: |
          uv run --locked python - <<'PYCODE'
          import json
          from pathlib import Path
          root = Path("test-diagnostics")
          pids = set()
          tails = set()
          for path in sorted(root.glob("*.jsonl")):
              rows = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines()]
              if not any("test_array_maintenance_repair" in row.get("project_root", "") for row in rows):
                  continue
              print(path.name)
              for row in rows[-8:]:
                  print(json.dumps(row))
                  endpoint = row.get("endpoint") or {}
                  if "pid" in endpoint:
                      pids.add(endpoint["pid"])
              if rows:
                  tails.add(rows[-1]["log_tail"])
          for name in sorted(tails):
              path = root / name
              if path.is_file():
                  print(path.name)
                  print("\n".join(path.read_text(encoding="utf-8", errors="replace").splitlines()[-100:]))
          for pid in sorted(pids):
              path = root / f"daemon-startup-{pid}.log"
              if path.is_file():
                  print(path.name)
                  print("\n".join(path.read_text(encoding="utf-8", errors="replace").splitlines()[-150:]))
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-journey-2-shutdown-evidence
          path: |
            .test-results/
            test-diagnostics/
          include-hidden-files: true
