name: Focused acceptance follow-up

on:
  push:
    branches: [qualify/0.1.0-windows-followup]

permissions:
  contents: read

jobs:
  regressions:
    name: Remaining Windows regressions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version-file: uv.lock
      - name: Verify exact remaining regressions
        run: >-
          uv run --locked pytest -q -n 0
          packages/lab-tools/tests/test_preview.py
          "packages/lab-tools/tests/test_teaching_mean_iq_journey.py::test_shipped_editing_lessons[refresh]"
          "packages/lab-tools/tests/test_teaching_mean_iq_journey.py::test_shipped_editing_lessons[None]"
          packages/lab-tools/tests/test_calibration_teaching_journey.py::test_procedure_capture_preserves_imports_and_checks_changed_source
          packages/lab-tools/tests/test_task_calibration_teaching_journey.py::test_managed_task_calibration_shipped_kernel
