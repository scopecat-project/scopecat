[project]
site_name = "Scopecat"
site_description = "User and contributor documentation for Scopecat."
site_author = "Scopecat contributors"
site_url = "https://scopecat-project.github.io/scopecat/"
repo_url = "https://github.com/scopecat-project/scopecat"
repo_name = "scopecat-project/scopecat"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Scopecat contributors"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/index.md",
    { "Source preview quickstart" = "getting-started/quickstart.md" },
  ] },
  { "Tutorials" = [
    "tutorials/index.md",
    { "Tour the reference lab" = "tutorials/reference-lab.md" },
  ] },
  { "How-to guides" = [
    "how-to/index.md",
    { "Write an experiment" = "how-to/write-an-experiment.md" },
    { "Refresh author code" = "how-to/refresh-author-code.md" },
    { "Control instruments" = "how-to/control-instruments.md" },
    { "Use measurement data" = "how-to/use-measurement-data.md" },
    { "Compare retained runs" = "how-to/retained-run-comparison.md" },
    { "Manage configuration" = "how-to/manage-configuration.md" },
    { "Back up and restore" = "how-to/backup-and-restore.md" },
  ] },
  { "Concepts" = [
    "concepts/index.md",
    { "Glossary" = "concepts/glossary.md" },
    { "Chips and physical samples" = "concepts/samples.md" },
    { "Experiment authoring dataflow" = "concepts/experiment-dataflow.md" },
    { "Analysis publication" = "concepts/analysis-publication.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "Command-line interface" = "reference/cli.md" },
    { "Project layout" = "reference/project-layout.md" },
    { "Python API" = [
      "reference/python/index.md",
      { "scopecat" = "reference/python/scopecat.md" },
      { "scopecat_instruments" = "reference/python/instruments.md" },
      { "scopecat_quantum.authoring" = "reference/python/quantum.md" },
    ] },
  ] },
  { "Extensions" = [
    "extensions/index.md",
    { "Instruments" = "extensions/instruments.md" },
    { "Payload codecs" = "extensions/payload-codecs.md" },
    { "Quantum" = "extensions/quantum.md" },
    { "Connection residency" = "extensions/connection-residency.md" },
  ] },
  { "Development" = [
    "development/index.md",
    { "Repository map" = "development/repository-map.md" },
    { "Core workflow evaluations" = "development/workflow-evaluations.md" },
    { "Supervised laboratory pilot roadmap" = "development/lab-pilot-roadmap.md" },
    { "Pilot work slices and acceptance fixtures" = "development/pilot-work-slices.md" },
    { "Architecture" = [
      "development/architecture/index.md",
      { "Experiment execution" = "development/architecture/execution.md" },
      { "Lab daemon" = "development/architecture/daemon.md" },
    ] },
    { "Scalability benchmarks" = "development/scalability.md" },
    { "Project charter" = "development/project-charter.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]

[project.plugins.mkdocstrings.handlers.python]
paths = [
  "packages/scopecat/src",
  "packages/scopecat-instruments/src",
  "packages/scopecat-quantum/src",
  "packages/scopecat-server/src",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
members_order = "source"
show_root_heading = true
show_source = false
