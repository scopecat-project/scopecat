"examples/reference_lab/tests/unit/test_provider.py" = 0.0
"examples/reference_lab/tests/unit/test_quantum_runner.py" = 14.1
"packages/scopecat-server/tests/test_author_validation_diagnostics.py" = 61.5
"packages/scopecat-server/tests/test_snapshot_integration.py" = 44.7

[tool.uv]
exclude-newer = "3d"
default-groups = ["dev"]
package = false

[tool.uv.sources]
scopecat-lab-tools = { workspace = true }
scopecat-lab-teaching = { workspace = true, editable = false }
reference-lab = { workspace = true }
scopecat = { workspace = true }
scopecat-instruments = { workspace = true }
scopecat-quantum = { workspace = true }
scopecat-server = { workspace = true }
scopecat-testkit = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/*",
  "examples/reference_lab",
  "testing/*",
]
