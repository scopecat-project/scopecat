[project]
name = "scopecat-workspace"
version = "0.1.0"
description = "Workspace for Scopecat packages and integration fixtures."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "reference-lab",
  "scopecat",
  "scopecat-instruments",
  "scopecat-app",
  "scopecat-quantum",
  "scopecat-server",
  "scopecat-testkit[server]",
]

[dependency-groups]
platform-smoke = ["pytest>=9", "pytest-xdist>=3.8", "scopecat-app[desktop]"]
dev = [
  "basedpyright>=1.39.6",
  "hypothesis>=6.155.7",
  "import-linter>=2.13",
  "playwright==1.64.0",
  "psutil>=7.2",
  "pytest>=9",
  "pytest-xdist>=3.8",
  "ruff>=0.16.0",
  { include-group = "delivery" },
]
delivery = ["scopecat-app[kernel,desktop]", "uv_build>=0.13,<0.14"]
delivery-build = ["pip>=25", "setuptools>=80", "wheel>=0.45"]
delivery-notebook = ["scopecat-app[notebook]", { include-group = "delivery" }]
docs = [
  "mkdocstrings-python>=2",
  "zensical>=0.0.43,<0.1",
]
notebook = [
  "ipykernel>=6.29",
]

[tool.basedpyright]
include = [
  "packages/scopecat/src",
  "packages/scopecat/tests",
  "packages/scopecat-tutorials/src",
  "packages/scopecat-app/src",
  "packages/scopecat-app/tests",
  "packages/scopecat-server/src",
  "packages/scopecat-server/tests",
  "packages/scopecat-instruments/src",
  "packages/scopecat-instruments/tests",
  "packages/scopecat-quantum/src",
  "packages/scopecat-quantum/tests",
  "testing/reference_lab/src",
  "testing/reference_lab/tests",
  "testing/fixtures/retained-signal/src",
  "scripts",
  "benchmarks",
  "testing/scopecat-testkit/src",
  "testing/app_support",
  "conftest.py",
]
# Course resources execute inside generated author workspaces; validate those
# through tutorial/journey tests rather than resolving their imports here.
exclude = [
  "testing/app_support/course_material",
  "packages/scopecat-tutorials/src/scopecat_tutorials/course_material",
  "**/__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
]
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "recommended"
extraPaths = [
  ".",
  "testing/fixtures/retained-signal/src",
  "packages/scopecat",
  "packages/scopecat/src",
  "packages/scopecat-tutorials/src",
  "packages/scopecat-app/src",
  "packages/scopecat-server/src",
  "packages/scopecat-instruments",
  "packages/scopecat-instruments/src",
  "packages/scopecat-quantum",
  "packages/scopecat-quantum/src",
  "testing/reference_lab",
  "testing/reference_lab/src",
  "testing/scopecat-testkit/src",
]
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportPrivateUsage = "error"
reportUninitializedInstanceVariable = "error"
reportImplicitStringConcatenation = "none"
reportUnannotatedClassAttribute = "none"
reportUnusedCallResult = "none"
reportUnusedParameter = "hint"
reportUnreachable = "hint"

# Execution environments use first-match semantics, so nested and test-specific
# roots must precede their parent projects.
[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-app/tests"
# Keep dynamic fixture/JSON warnings visible without blocking this newly covered
# test root. Errors still fail; other roots retain their existing warning gate.
failOnWarnings = false
# Lifecycle and packaging tests intentionally inspect private state and helpers.
# Keep argument/member/optional checks active, including for test doubles.
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "testing/reference_lab/tests"
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-quantum/tests"
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-server/tests"
reportAny = "none"
reportExplicitAny = "none"
reportPrivateUsage = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"

[[tool.basedpyright.executionEnvironments]]
root = "testing/scopecat-testkit/src"
# argparse/pytest options and JSON event logs cross dynamically typed boundaries.
reportAny = "none"
# White-box fixtures construct bound programs and inspect project-loader state.
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-server/src"
# Worker entry functions are referenced from other modules, not their owner file.
reportUnusedFunction = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-instruments/tests"
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat/tests"
reportAny = "none"
reportExplicitAny = "none"
reportPrivateUsage = "none"

[tool.importlinter]
root_packages = [
  "scripts",
  "testing.app_support",
  "scopecat_app",
  "scopecat_tutorials",
  "scopecat",
  "scopecat_instruments",
  "scopecat_quantum",
  "scopecat_server",
  "scopecat_testkit",
]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Installed packages do not depend on repository tooling"
type = "forbidden"
source_modules = ["scopecat_app", "scopecat_tutorials", "scopecat", "scopecat_server", "scopecat_instruments", "scopecat_quantum"]
forbidden_modules = ["scripts", "testing.app_support"]

[[tool.importlinter.contracts]]
name = "Scopecat core remains domain neutral"
type = "forbidden"
source_modules = ["scopecat"]
forbidden_modules = [
  "scopecat_instruments",
  "scopecat_quantum",
  "scopecat_server",
  "scopecat_app",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Server does not depend on application and delivery tools"
type = "forbidden"
source_modules = ["scopecat_server"]
forbidden_modules = ["scopecat_app"]

[[tool.importlinter.contracts]]
name = "Inward layers do not depend on application or storage"
type = "forbidden"
source_modules = [
  "scopecat.compiler",
  "scopecat.kernel",
  "scopecat.records",
]
forbidden_modules = [
  "scopecat.api",
  "scopecat.application",
  "scopecat.config.registry",
  "scopecat.execution",
  "scopecat.planning",
  "scopecat.runs",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Shared program model does not depend on outward layers"
type = "forbidden"
source_modules = ["scopecat.program"]
forbidden_modules = [
  "scopecat.authoring",
  "scopecat.compiler",
  "scopecat.measurements",
  "scopecat.records",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Compiler consumes the shared program model, not authoring"
type = "forbidden"
source_modules = ["scopecat.compiler"]
forbidden_modules = ["scopecat.authoring"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Server does not depend on optional domain packages"
type = "forbidden"
source_modules = ["scopecat_server"]
forbidden_modules = [
  "scopecat_instruments",
  "scopecat_quantum",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Instrument package remains independent of server and quantum domains"
type = "forbidden"
source_modules = ["scopecat_instruments"]
forbidden_modules = [
  "scopecat_quantum",
  "scopecat_server",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Quantum package remains independent of server and instruments"
type = "forbidden"
source_modules = ["scopecat_quantum"]
forbidden_modules = [
  "scopecat_instruments",
  "scopecat_server",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Extension packages do not use private authoring implementation modules"
type = "forbidden"
source_modules = [
  "scopecat_instruments",
  "scopecat_quantum",
  "scopecat_server",
]
forbidden_modules = [
  "scopecat.authoring._experiment_module",
  "scopecat.authoring._module_context",
  "scopecat.authoring._module_invocation",
  "scopecat.authoring._module_results",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Server storage remains independent of orchestration"
type = "forbidden"
source_modules = ["scopecat_server.storage"]
forbidden_modules = [
  "scopecat_server.http",
  "scopecat_server.instruments",
  "scopecat_server.runtime",
  "scopecat_server.services",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Core and server package dependencies are acyclic"
type = "acyclic_siblings"
ancestors = [
  "scopecat",
  "scopecat_server",
]
# Check concrete top-level module dependencies without aggregating deeper siblings.
depth = 0

[[tool.importlinter.contracts]]
name = "Core test support remains server independent"
type = "forbidden"
source_modules = [
  "scopecat_testkit.authoring",
  "scopecat_testkit.bound_program",
  "scopecat_testkit.config_registry",
  "scopecat_testkit.connection_residency",
  "scopecat_testkit.domain",
  "scopecat_testkit.execution_fakes",
  "scopecat_testkit.expressions",
  "scopecat_testkit.instrument_drivers",
  "scopecat_testkit.instrument_host",
  "scopecat_testkit.local_materialization",
  "scopecat_testkit.materialized_effects",
  "scopecat_testkit.measurement_assembly",
  "scopecat_testkit.measurement_models",
  "scopecat_testkit.parameter_fixtures",
  "scopecat_testkit.paths",
  "scopecat_testkit.payload_codecs",
  "scopecat_testkit.planning",
  "scopecat_testkit.project_loading",
  "scopecat_testkit.records",
  "scopecat_testkit.routing",
  "scopecat_testkit.run_operations",
  "scopecat_testkit.signal_instruments",
  "scopecat_testkit.workflow_fixtures",
]
forbidden_modules = [
  "scopecat_server",
  "scopecat_testkit.server",
]
allow_indirect_imports = true

[tool.pytest]
pythonpath = ["."]
addopts = [
  "-n",
  "auto",
  "--maxprocesses=4",
  "--dist=worksteal",
  "--import-mode=importlib",
]
minversion = "9.0"
strict_config = true
strict_markers = true
testpaths = [
  "testing/reference_lab/tests",
  "packages/scopecat-app/tests",
  "packages/scopecat-instruments/tests",
  "packages/scopecat-quantum/tests",
  "packages/scopecat-server/tests",
  "packages/scopecat/tests",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = [
  "packages/scopecat/src",
  "packages/scopecat-tutorials/src",
  "packages/scopecat-app/src",
  "packages/scopecat-server/src",
  "packages/scopecat-server/tests",
  "packages/scopecat-instruments/src",
  "packages/scopecat-instruments/tests",
  "packages/scopecat/tests",
  "packages/scopecat-quantum/src",
  "packages/scopecat-quantum/tests",
  "testing/reference_lab/src",
  "testing/reference_lab/tests",
  "scripts",
  "benchmarks",
  "testing/scopecat-testkit/src",
]

[tool.ruff.lint]
ignore = [
  # Domain APIs intentionally use conventional names such as id, type, and input.
  "A001",
  "A002",
  "A004",
  # Assertions express test expectations and trusted internal invariants.
  "S101",
]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "C90",
  "DTZ",
  "E",
  "F",
  "FA",
  "G",
  "I",
  "ISC",
  "LOG",
  "PERF102",
  "PERF402",
  "PIE",
  "PLC0206",
  "PLE",
  "PTH",
  "PT011",
  "PT017",
  "PYI",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "T10",
  "TID251",
  "TC006",
  "TRY203",
  "TRY400",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"scripts/app_build/**/*.py" = ["RUF001", "RUF002", "RUF003", "TID251"]
"scripts/dev.py" = ["RUF001", "RUF002", "RUF003", "TID251"]
"testing/app_support/**/*.py" = ["RUF001", "RUF002", "RUF003"]
"testing/app_support/**/*.ipynb" = ["RUF001", "RUF002", "RUF003", "E402"]
"apps/scopecat-ui/scripts/export-openapi.py" = ["TID251"]
"scripts/generate_reference_lab_acceptance.py" = ["TID251"]
"testing/reference_lab/tests/**/*.py" = ["TID251"]
"packages/scopecat-server/**/*.py" = ["TID251"]
"packages/scopecat-app/**/*.py" = ["TID251"]
"packages/scopecat/src/scopecat/program/point_domain.py" = [
  # PEP 695 has no explicit variance syntax; PointAxis[Never] needs covariance.
  "UP046",
]
"packages/scopecat-instruments/src/scopecat_instruments/__init__.py" = ["PLE0605"]
"packages/scopecat-instruments/src/scopecat_instruments/drivers/__init__.py" = ["PLE0605"]
"packages/scopecat-instruments/src/scopecat_instruments/virtual/__init__.py" = ["PLE0605"]
"packages/scopecat/src/scopecat/__init__.py" = ["PLE0605"]
"packages/scopecat/src/scopecat/application/__init__.py" = ["PLE0605"]
"packages/scopecat/src/scopecat/config/registry/__init__.py" = ["PLE0605"]
"packages/scopecat/src/scopecat/sdk/instruments/__init__.py" = ["PLE0605"]
"**/tests/**/*.py" = [
  "ARG001",
]
"testing/scopecat-testkit/src/scopecat_testkit/**/*.py" = [
  "ARG001",
]
"testing/scopecat-testkit/src/scopecat_testkit/server/**/*.py" = [
  "TID251",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"scopecat_server".msg = "Only server-owned integration code may depend on scopecat_server"
"scopecat_testkit.server".msg = "Core tests must use server-independent test support"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.flake8-bugbear]
# Immutable quantities are intentional declaration defaults, not mutable state.
extend-immutable-calls = ["scopecat.Quantity", "scopecat.kernel.quantity.Quantity"]

