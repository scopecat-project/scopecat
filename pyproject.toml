[project]
name = "scopecat-workspace"
version = "0.1.0"
description = "Workspace for Scopecat packages, examples, and fixtures."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "reference-lab",
  "scopecat",
  "scopecat-instruments",
  "scopecat-lab-tools",
  "scopecat-quantum",
  "scopecat-server",
  "scopecat-testkit[server]",
]

[dependency-groups]
dev = [
  "basedpyright>=1.39.6",
  "hypothesis>=6.155.7",
  "import-linter>=2.13",
  "psutil>=7.2",
  "pytest>=9",
  "pytest-xdist>=3.8",
  "ruff>=0.16.0",
  { include-group = "delivery" },
]
delivery = ["scopecat-lab-tools[kernel]", "uv_build>=0.12.3,<0.13"]
delivery-build = ["pip>=25"]
delivery-notebook = ["scopecat-lab-tools[notebook]", { include-group = "delivery" }]
docs = [
  "mkdocstrings-python>=2",
  "zensical>=0.0.43,<0.1",
]
notebook = [
  "ipykernel>=6.29",
]

[tool.basedpyright]
include = [
  "packages/scopecat/src",
  "packages/scopecat/tests",
  "packages/lab-teaching/src",
  "packages/lab-tools/src",
  "packages/scopecat-server/src",
  "packages/scopecat-server/tests",
  "packages/scopecat-instruments/src",
  "packages/scopecat-instruments/tests",
  "packages/scopecat-quantum/src",
  "packages/scopecat-quantum/tests",
  "examples/reference_lab/src",
  "examples/reference_lab/notebooks",
  "examples/reference_lab/tests",
  "scripts",
  "benchmarks",
  "testing/scopecat-testkit/src",
]
exclude = [
  "packages/lab-teaching/src/lab_teaching/course_material",
  "**/__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
]
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "recommended"
extraPaths = [
  "packages/scopecat",
  "packages/scopecat/src",
  "packages/lab-teaching/src",
  "packages/lab-tools/src",
  "packages/scopecat-server/src",
  "packages/scopecat-instruments",
  "packages/scopecat-instruments/src",
  "packages/scopecat-quantum",
  "packages/scopecat-quantum/src",
  "examples/reference_lab",
  "examples/reference_lab/src",
  "testing/scopecat-testkit/src",
]
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportPrivateUsage = "error"
reportUninitializedInstanceVariable = "error"
reportImplicitStringConcatenation = "none"
reportUnannotatedClassAttribute = "none"
reportUnusedCallResult = "none"
reportUnusedParameter = "hint"
reportUnreachable = "hint"

# Execution environments use first-match semantics, so nested and test-specific
# roots must precede their parent projects.
[[tool.basedpyright.executionEnvironments]]
root = "examples/reference_lab/tests"
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-quantum/tests"
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-server/tests"
reportAny = "none"
reportExplicitAny = "none"
reportPrivateUsage = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"

[[tool.basedpyright.executionEnvironments]]
root = "testing/scopecat-testkit/src"
reportAny = "none"
reportExplicitAny = "none"
reportPrivateUsage = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-server/src"
reportUnusedFunction = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-instruments/tests"
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat/tests"
reportAny = "none"
reportExplicitAny = "none"
reportPrivateUsage = "none"

[tool.importlinter]
root_packages = [
  "scopecat",
  "scopecat_instruments",
  "scopecat_quantum",
  "scopecat_server",
  "scopecat_testkit",
]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Scopecat core remains domain neutral"
type = "forbidden"
source_modules = ["scopecat"]
forbidden_modules = [
  "scopecat_instruments",
  "scopecat_quantum",
  "scopecat_server",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Inward layers do not depend on application or storage"
type = "forbidden"
source_modules = [
  "scopecat.compiler",
  "scopecat.kernel",
  "scopecat.records",
]
forbidden_modules = [
  "scopecat.api",
  "scopecat.application",
  "scopecat.config.registry",
  "scopecat.execution",
  "scopecat.planning",
  "scopecat.runs",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Shared program model does not depend on outward layers"
type = "forbidden"
source_modules = ["scopecat.program"]
forbidden_modules = [
  "scopecat.authoring",
  "scopecat.compiler",
  "scopecat.measurements",
  "scopecat.records",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Compiler consumes the shared program model, not authoring"
type = "forbidden"
source_modules = ["scopecat.compiler"]
forbidden_modules = ["scopecat.authoring"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Server does not depend on optional domain packages"
type = "forbidden"
source_modules = ["scopecat_server"]
forbidden_modules = [
  "scopecat_instruments",
  "scopecat_quantum",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Instrument package remains independent of server and quantum domains"
type = "forbidden"
source_modules = ["scopecat_instruments"]
forbidden_modules = [
  "scopecat_quantum",
  "scopecat_server",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Quantum package remains independent of server and instruments"
type = "forbidden"
source_modules = ["scopecat_quantum"]
forbidden_modules = [
  "scopecat_instruments",
  "scopecat_server",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Extension packages do not use private authoring implementation modules"
type = "forbidden"
source_modules = [
  "scopecat_instruments",
  "scopecat_quantum",
  "scopecat_server",
]
forbidden_modules = [
  "scopecat.authoring._experiment_module",
  "scopecat.authoring._module_context",
  "scopecat.authoring._module_invocation",
  "scopecat.authoring._module_results",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Server storage remains independent of orchestration"
type = "forbidden"
source_modules = ["scopecat_server.storage"]
forbidden_modules = [
  "scopecat_server.http",
  "scopecat_server.instruments",
  "scopecat_server.runtime",
  "scopecat_server.services",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Core and server package dependencies are acyclic"
type = "acyclic_siblings"
ancestors = [
  "scopecat",
  "scopecat_server",
]
# Check concrete top-level module dependencies without aggregating deeper siblings.
depth = 0

[[tool.importlinter.contracts]]
name = "Core test support remains server independent"
type = "forbidden"
source_modules = [
  "scopecat_testkit.authoring",
  "scopecat_testkit.bound_program",
  "scopecat_testkit.config_registry",
  "scopecat_testkit.connection_residency",
  "scopecat_testkit.domain",
  "scopecat_testkit.execution_fakes",
  "scopecat_testkit.expressions",
  "scopecat_testkit.instrument_drivers",
  "scopecat_testkit.instrument_host",
  "scopecat_testkit.local_materialization",
  "scopecat_testkit.materialized_effects",
  "scopecat_testkit.measurement_assembly",
  "scopecat_testkit.measurement_models",
  "scopecat_testkit.parameter_fixtures",
  "scopecat_testkit.paths",
  "scopecat_testkit.payload_codecs",
  "scopecat_testkit.planning",
  "scopecat_testkit.project_loading",
  "scopecat_testkit.records",
  "scopecat_testkit.routing",
  "scopecat_testkit.run_operations",
  "scopecat_testkit.signal_instruments",
  "scopecat_testkit.workflow_fixtures",
]
forbidden_modules = [
  "scopecat_server",
  "scopecat_testkit.server",
]
allow_indirect_imports = true

[tool.pytest]
addopts = [
  "-n",
  "auto",
  "--maxprocesses=4",
  "--dist=worksteal",
  "--import-mode=importlib",
]
minversion = "9.0"
strict_config = true
strict_markers = true
testpaths = [
  "examples/reference_lab/tests",
  "packages/lab-tools/tests",
  "packages/scopecat-instruments/tests",
  "packages/scopecat-quantum/tests",
  "packages/scopecat-server/tests",
  "packages/scopecat/tests",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = [
  "packages/scopecat/src",
  "packages/lab-teaching/src",
  "packages/lab-tools/src",
  "packages/scopecat-server/src",
  "packages/scopecat-server/tests",
  "packages/scopecat-instruments/src",
  "packages/scopecat-instruments/tests",
  "packages/scopecat/tests",
  "packages/scopecat-quantum/src",
  "packages/scopecat-quantum/tests",
  "examples/reference_lab/src",
  "examples/reference_lab/notebooks",
  "examples/reference_lab/tests",
  "scripts",
  "benchmarks",
  "testing/scopecat-testkit/src",
]

[tool.ruff.lint]
ignore = [
  # Domain APIs intentionally use conventional names such as id, type, and input.
  "A001",
  "A002",
  "A004",
  # Assertions express test expectations and trusted internal invariants.
  "S101",
]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "C90",
  "DTZ",
  "E",
  "F",
  "FA",
  "G",
  "I",
  "ISC",
  "LOG",
  "PERF102",
  "PERF402",
  "PIE",
  "PLC0206",
  "PLE",
  "PTH",
  "PT011",
  "PT017",
  "PYI",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "T10",
  "TID251",
  "TC006",
  "TRY203",
  "TRY400",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"apps/scopecat-ui/scripts/export-openapi.py" = ["TID251"]
"scripts/generate_reference_lab_acceptance.py" = ["TID251"]
"examples/reference_lab/tests/**/*.py" = ["TID251"]
"packages/scopecat-server/**/*.py" = ["TID251"]
"packages/lab-tools/**/*.py" = ["TID251"]
"packages/scopecat/src/scopecat/program/point_domain.py" = [
  # PEP 695 has no explicit variance syntax; PointAxis[Never] needs covariance.
  "UP046",
]
"packages/scopecat-instruments/src/scopecat_instruments/__init__.py" = ["PLE0605"]
"packages/scopecat-instruments/src/scopecat_instruments/drivers/__init__.py" = ["PLE0605"]
"packages/scopecat-instruments/src/scopecat_instruments/virtual/__init__.py" = ["PLE0605"]
"packages/scopecat/src/scopecat/__init__.py" = ["PLE0605"]
"packages/scopecat/src/scopecat/application/__init__.py" = ["PLE0605"]
"packages/scopecat/src/scopecat/config/registry/__init__.py" = ["PLE0605"]
"packages/scopecat/src/scopecat/sdk/instruments/__init__.py" = ["PLE0605"]
"**/tests/**/*.py" = [
  "ARG001",
]
"testing/scopecat-testkit/src/scopecat_testkit/**/*.py" = [
  "ARG001",
]
"testing/scopecat-testkit/src/scopecat_testkit/server/**/*.py" = [
  "TID251",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"scopecat_server".msg = "Only server-owned integration code may depend on scopecat_server"
"scopecat_testkit.server".msg = "Core tests must use server-independent test support"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.flake8-bugbear]
# Immutable quantities are intentional declaration defaults, not mutable state.
extend-immutable-calls = ["scopecat.Quantity", "scopecat.kernel.quantity.Quantity"]

[tool.scopecat-tests]
roots = ["packages/lab-tools/tests", "examples/reference_lab/tests", "packages/scopecat/tests", "packages/scopecat-server/tests", "packages/scopecat-instruments/tests", "packages/scopecat-quantum/tests"]
fast_paths = [
  "examples/reference_lab/tests/unit",
  "packages/scopecat/tests",
  "packages/scopecat-instruments/tests",
  "packages/scopecat-quantum/tests",
  "packages/lab-tools/tests/test_test_tiers.py",
]
# Lab/application tests require a file-level decision. New files must be classified.
integration_paths = [
  "packages/scopecat-server/tests",
  "packages/lab-tools/tests/test_application_entry.py",
  "packages/lab-tools/tests/test_author_notebook.py",
  "packages/lab-tools/tests/test_calibration_smoke.py",
  "packages/lab-tools/tests/test_delivery_recipe.py",
  "packages/lab-tools/tests/test_entry.py",
  "packages/lab-tools/tests/test_first_run.py",
  "packages/lab-tools/tests/test_first_run_journey.py",
  "packages/lab-tools/tests/test_host.py",
  "packages/lab-tools/tests/test_installed_tools.py",
  "packages/lab-tools/tests/test_lab_environment.py",
  "packages/lab-tools/tests/test_maintenance.py",
  "packages/lab-tools/tests/test_sandboxes.py",
  "packages/lab-tools/tests/test_services.py",
  "packages/lab-tools/tests/test_settings_journey.py",
  "packages/lab-tools/tests/test_teaching_delivery.py",
]
journey_paths = [
  "packages/lab-tools/tests/test_array_maintenance.py",
  "packages/lab-tools/tests/test_installed_adapter_journey.py",
  "packages/lab-tools/tests/test_calibration_teaching_journey.py",
  "packages/lab-tools/tests/test_host_journey.py",
  "packages/lab-tools/tests/test_notebook_workspace_journey.py",
  "packages/lab-tools/tests/test_unknown_parameter_authoring.py",
  "packages/lab-tools/tests/test_minimal_teaching_journey.py",
  "packages/lab-tools/tests/test_teaching_mean_iq_journey.py",
  "packages/lab-tools/tests/test_grouped_teaching_journey.py",
  "packages/scopecat-server/tests/test_runtime_binding.py",
  "examples/reference_lab/tests",
  "packages/scopecat-server/tests/test_snapshot_integration.py",
  "packages/scopecat-server/tests/test_author_validation_diagnostics.py",
]

# Windows run 34757173348: summed setup/call/teardown seconds per file.
[tool.scopecat-tests.weights]
# Ubuntu run 35891413427: newly classified qualification journeys.
"packages/lab-tools/tests/test_array_maintenance.py" = 231.2
"packages/lab-tools/tests/test_installed_adapter_journey.py" = 45.2
"examples/reference_lab/tests/test_acceptance.py" = 37.3
"examples/reference_lab/tests/test_analysis_recovery.py" = 6.1
"examples/reference_lab/tests/test_author_launch.py" = 232.3
"examples/reference_lab/tests/test_author_refresh.py" = 161.5
"examples/reference_lab/tests/test_awg_output_monitor.py" = 0.5
"examples/reference_lab/tests/test_comparison.py" = 78.8
"examples/reference_lab/tests/test_controls.py" = 0.0
"examples/reference_lab/tests/test_daemon_client.py" = 4.6
"examples/reference_lab/tests/test_everyday_author.py" = 1.5
"examples/reference_lab/tests/test_experiment_plans.py" = 145.2
"examples/reference_lab/tests/test_exploration.py" = 3.3
"examples/reference_lab/tests/test_flux_spectroscopy.py" = 9.9
"examples/reference_lab/tests/test_gallery_notebooks.py" = 73.2
"examples/reference_lab/tests/test_launch.py" = 111.5
