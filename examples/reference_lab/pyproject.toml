[project]
name = "reference-lab"
version = "0.1.0"
description = "One hardware-free reference laboratory for the Scopecat gallery."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "numpy>=2",
  "scipy>=1.16",
  "scopecat-instruments",
  "scopecat-quantum",
  "scopecat[polars]",
]

[dependency-groups]
test = [
  "pytest>=9",
  "scopecat-server",
  "scopecat-testkit[server]",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.pytest]
addopts = ["--import-mode=importlib"]
minversion = "9.0"
strict_config = true
strict_markers = true
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]
exclude = [
  ".scopecat-examples",
]

[tool.uv.build-backend]
module-name = ["reference_lab", "reference_lab_authors"]

[tool.uv.sources]
scopecat = { workspace = true }
scopecat-instruments = { workspace = true }
scopecat-quantum = { workspace = true }
scopecat-server = { workspace = true }
scopecat-testkit = { workspace = true }
